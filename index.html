<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A little note</title>
  <style>
    /* --fw / --fh: size of the frame, it fills the screen in any format.
       --n: scale of the frame drawing (width the drawing would have unstretched); hooks, corner gap and plane are sized from it. */
    :root { --fw: 90vw; --fh: 92vh; --n: min(calc(var(--fw) / 0.8), calc(var(--fh) / 0.72)); }
    @supports (height: 1dvh) { :root { --fh: 92dvh; } }

    .page { position: relative; width: var(--fw); height: var(--fh); }

    /* Frame drawing cut into 9 pieces: the corners (with hooks and the gap) keep their shape, only the plain lines between them stretch */
    .frame { position: absolute; inset: 0; box-sizing: border-box; pointer-events: none; border-style: solid; border-color: transparent;
      border-width: calc(var(--n) * 0.3026) calc(var(--n) * 0.36) calc(var(--n) * 0.0605) calc(var(--n) * 0.3002);
      border-image: url("rahmen.png") 1006 1197 201 998 stretch; }
    /* Plane leaves through the gap in the frame's top right corner */
    .plane { position: absolute; right: calc(var(--n) * -0.039); top: calc(var(--n) * 0.1136); width: calc(var(--n) * 0.26); height: auto; pointer-events: none; }

    /* --h: height of one label, --a: width of the portrait. Right padding keeps clear of the plane's trail. */
    .content { --h: calc(var(--n) * 0.07); --a: calc(var(--n) * 0.26);
      position: absolute; inset: 0; box-sizing: border-box; display: flex; align-items: center; gap: calc(var(--n) * 0.03);
      padding: calc(var(--n) * 0.16) calc(var(--n) * 0.25) calc(var(--n) * 0.07) calc(var(--n) * 0.08); }

    .nav { display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--h) * 0.4); }
    .nav img { display: block; height: var(--h); width: auto; }
    .nav > :nth-child(1) { transform: rotate(-2deg); }
    .nav > :nth-child(2) { transform: rotate(1.5deg); }
    .nav > :nth-child(3) { transform: rotate(-1deg); }
    .nav button { background: none; border: none; padding: 0; cursor: pointer; transition: transform 0.12s ease; }
    .nav button:hover { transform: rotate(1.5deg) scale(1.06); }
    .nav button:active { transform: rotate(1.5deg) scale(0.97); }

    .me { width: var(--a); margin: 0 auto; flex: none; }
    .me img { display: block; height: auto; }
    .me .portrait { width: 100%; }
    .me .name { width: 89%; margin: 2% auto 0; }

    /* Square and portrait screens: portrait on top, labels below it. --h is the largest label height that still fits in height and width. */
    @media (max-aspect-ratio: 5/4) {
      .content { --h: min(calc((var(--fh) - var(--n) * 0.25) / 7.7), calc((var(--fw) - var(--n) * 0.46) / 2.2), calc((var(--fw) - var(--n) * 0.18) / 4)); --a: calc(var(--h) * 2.2);
        flex-direction: column; justify-content: center; align-items: flex-start; gap: calc(var(--h) * 0.5); padding-right: calc(var(--n) * 0.08); }
      .me { order: -1; }
    }
  </style>
</head>
<body style="margin: 0; min-height: 100%; background: #f3f4f6; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">

  <main class="page">
    <div class="frame"></div>
    <img class="plane" src="Drawing%207.png" alt="">

    <div class="content">
      <nav class="nav">
        <img src="aboutme.svg" alt="About me">
        <button id="open" type="button"><img src="skills.svg" alt="Skills"></button>
        <img src="techstack.svg" alt="Techstack">
      </nav>

      <figure class="me">
        <img class="portrait" src="portrait.png" alt="Drawn portrait of Jasmin">
        <img class="name" src="jasmin.svg" alt="Jasmin">
      </figure>
    </div>
  </main>

  <dialog id="modal" aria-labelledby="msg"
    style="border: none; padding: 2.5rem 2rem 2rem; width: min(90vw, 26rem); border-radius: 1.75rem; background: #fff8e1; color: #1b2a6b; text-align: center;">
    <p id="msg"
      style="margin: 0 0 1.75rem; font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -0.02em;">
      You're great.
    </p>
    <button id="close" type="button"
      style="font: inherit; font-weight: 700; font-size: 1rem; color: #fff8e1; background: #1b2a6b; border: none; border-radius: 999px; padding: 0.7rem 1.6rem; cursor: pointer;">
      Thanks!
    </button>
  </dialog>

  <script>
    const modal = document.getElementById('modal');

    document.getElementById('open').addEventListener('click', () => modal.showModal());
    document.getElementById('close').addEventListener('click', () => modal.close());
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
  </script>
</body>
</html>
