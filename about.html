<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About me</title>
  <style>
    .back { position: fixed; top: 1rem; left: 1.25rem; font-weight: 700; font-size: 1.1rem; color: #1d6585; text-decoration: none; }
    .back:hover { text-decoration: underline; }

    .title { margin: 0; padding-top: 3.5rem; text-align: center; }
    .title img { width: min(80vw, 30rem); height: auto; }

    /* --cw: width of the car image. The road spans the bottom of the screen and hides the car while it is still off screen. */
    .road { --cw: clamp(240px, 36vw, 480px); position: fixed; left: 0; right: 0; bottom: 1.5rem; overflow: hidden; border-bottom: 3px solid #111; pointer-events: none; }
    /* The lane is as wide as the screen with the car parked at its right end; sliding the lane in from the left drives the car across. */
    .lane { display: flex; justify-content: flex-end; animation: drive 3.5s cubic-bezier(0.3, 0, 0.2, 1) both; }
    /* Negative margins trim the empty space around the car inside the image, so it stops at the edge with its wheels on the line */
    .car { display: block; width: var(--cw); height: auto; flex: none; margin-right: calc(var(--cw) * -0.19); margin-bottom: calc(var(--cw) * -0.062); }

    @keyframes drive { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .lane { animation: none; } }
  </style>
</head>
<body style="margin: 0; min-height: 100%; background: #f3f4f6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">

  <a class="back" href="index.html">&larr; Back</a>

  <main>
    <h1 class="title"><img src="aboutme.svg" alt="About me"></h1>
  </main>

  <div class="road">
    <div class="lane">
      <img class="car" src="dachzelt.png" alt="">
    </div>
  </div>

</body>
</html>
